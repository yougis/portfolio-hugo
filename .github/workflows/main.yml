name: Deploy Hugo site to Synology NAS

on:
  push:
    branches:
      - main # ou master selon votre branche principale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: "NAS SYNO"
    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Si vous utilisez un thème Hugo en sous-module
          fetch-depth: 0

      # 2. Installation de Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.0' # Au lieu de 'latest'
          extended: true

      # 3. Compilation du site en HTML statique
      - name: Build site
        run: hugo --minify

      - name: Déploiement Rsync vers le NAS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: "rouyre.familyds.org"
          REMOTE_USER: ${{ secrets.NAS_USER }}
          REMOTE_PORT: "22"
          TARGET: "/volume1/web/"
          SOURCE: "public/"
          ARGS: "-rlptgoDzc --delete"
